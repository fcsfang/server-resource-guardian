[Slice]
# user.slice is a systemd special slice; its parent is encoded by its name.
# Protect it as a parallel rescue domain instead of trying to reparent it.
CPUAccounting=true
IOAccounting=true
MemoryAccounting=true
TasksAccounting=true
CPUWeight=1000
IOWeight=1000
MemoryMin=128M
MemoryLow=512M
TasksMax=512
