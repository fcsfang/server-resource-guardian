# Guardian transport defense (part 2): userspace early-killer + login reserve
# The pinned-collapse transport failure was swap-grind lockout: the kernel
# grinds swap for tens of seconds before the OOM killer decides, freezing the
# TCP accept path. Kernel-side tuning cannot prevent the grind (it fires only
# at true exhaustion). A userspace killer acting at 10% available removes it.
# Validated on the WSL lab: 40/40 entry probes passed (was 19-20/40) with 28
# early-kill hogs during the storm window. See
# tools/guardian-recovery-lab/results/2026-09-23-benefit/layer1-solved-earlyoom.md

# --- sysctl: root login reserve + short time-to-decision under thrash ---
# admin_reserve: memory only root may allocate; the default (min(3% free, 8MB))
# is too small to fork a login shell under pressure. 256MB guarantees the
# admin can log in and kill the hog even in the worst moment.
vm.admin_reserve_kbytes = 262144
vm.user_reserve_kbytes = 131072
# swappiness 10: stop grinding swap eagerly; reach the OOM decision sooner.
vm.swappiness = 10

# --- earlyoom (userspace early killer) ---
# Install: apt install earlyoom, then /etc/default/earlyoom:
#   EARLYOOM_ARGS='-r 3600 -m 10 -s 100 --avoid "(^|/)(sshd|systemd|systemd-logind|init|guardian-runtime|guardian-collector)$" --prefer "(^|/)(python|stress-ng|dd)$"'
# -m 10 -s 100: trigger on the RAM floor alone (-s 10 is the classic
# misconfig: with large idle swap the swap test never fires).
# --avoid: never touch the login path or the Guardian control plane.
# --prefer: point at the usual unbounded-memory suspects first.
# GOTCHA: the packaged unit passes $EARLYOOM_ARGS literally. Fix with a
# drop-in: /etc/systemd/system/earlyoom.service.d/override.conf
#   [Service]
#   ExecStart=
#   ExecStart=/bin/sh -c '/usr/bin/earlyoom ${EARLYOOM_ARGS}'
# ACTION-BOUNDARY (Guardian safety rules): earlyoom is a platform-level
# safety net owned by the host admin, NOT a Guardian action. It never counts
# against Guardian's zero-action guarantee; Guardian never configures or
# invokes it. Its --avoid list must include the Guardian control plane so
# the two never fight over the same process.
