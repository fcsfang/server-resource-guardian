# Validated earlyoom configuration, installed by scripts/guardian-host-setup.sh
# as /etc/default/earlyoom. The EARLYOOM_ARGS line below is the deployable
# config; the installer copies that line verbatim. Everything above it is
# documentation and must keep the # prefix.
#
# -m 10 -s 100: trigger on the RAM floor alone. The classic -s 10 misconfig
#   never fires on hosts with large idle swap. -s 100 disables the swap test.
#   Measured on the WSL lab: 40/40 entry probes passed (was 19-20/40) with 28
#   early kills during the storm window - see
#   tools/guardian-recovery-lab/results/2026-09-23-benefit/layer1-solved-earlyoom.md
# --avoid: never touch the login path, the Guardian control plane, or the
#   host's real business processes (from tools/list-container-procs.sh on the
#   first dedicated test server SHKD010W: litellm, postgres, redis-server,
#   nginx, beszel agent). earlyoom killing a business container would turn a
#   host-pressure alert into a business outage - that decision belongs to the
#   admin, not the kernel heuristic. Keep both lists host-shaped: when this
#   file is deployed to a NEW host, re-run tools/list-container-procs.sh and
#   extend the avoid list with that host's real business processes.
# --prefer: point at the usual unbounded-memory suspects first.
#
# GOTCHA (why the systemd override exists): the packaged earlyoom unit passes
# $EARLYOOM_ARGS literally without shell expansion, so args in
# /etc/default/earlyoom never take effect. See
# deploy/guardian/earlyoom-systemd-override.conf.
EARLYOOM_ARGS='-r 3600 -m 10 -s 100 --avoid "(^|/)(sshd|systemd|systemd-logind|init|guardian-runtime|guardian-collector|python3.*feishu|litellm|postgres|redis-server|nginx|agent|beszel)$" --prefer "(^|/)(python|stress-ng|dd|fio)$"'
