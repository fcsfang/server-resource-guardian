# OOM defense for the operator entry path (ROADMAP outcome 2, Layer 1).
# sshd is the maintenance door: under global memory exhaustion it must never
# be an OOM-kill candidate. Install as
# /etc/systemd/system/ssh.service.d/guardian-oom-defense.conf
# (or sshd.service.d/ on systems naming the unit sshd), then
# `systemctl daemon-reload`. Do not restart sshd from a remote script; the
# drop-in takes effect at the next natural restart or reboot.
[Service]
OOMScoreAdjust=-1000
