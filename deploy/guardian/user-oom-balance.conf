# User-session OOM balance, installed by scripts/guardian-host-setup.sh as
# /etc/systemd/system/user@.service.d/guardian-oom-balance.conf.
#
# On WSL the user@.service manager defaults to oom_score_adj=100, which makes
# the session manager a HIGHER kernel-kill candidate than ordinary hog
# processes (adj 0) - the kernel killed the user session manager while the
# memory hogs that caused the pressure stayed alive (triple-resource
# experiment, 2026-09-24). Balancing to 0 ranks the session manager equal to
# ordinary processes so real hogs die first. On stock Ubuntu the default is
# already 0, so this drop-in is harmless there. The SSH entry path is
# unaffected either way: sshd carries OOMScoreAdjust=-1000.
# Evidence: tools/guardian-recovery-lab/results/2026-09-24-triple-resource/
[Service]
OOMScoreAdjust=0
