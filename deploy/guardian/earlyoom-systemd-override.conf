# earlyoom systemd override, installed by scripts/guardian-host-setup.sh as
# /etc/systemd/system/earlyoom.service.d/override.conf.
#
# The packaged earlyoom unit expands $EARLYOOM_ARGS as a single literal
# argument, so the args from /etc/default/earlyoom never reach earlyoom.
# Re-define ExecStart through a shell so ${EARLYOOM_ARGS} expands into
# separate arguments (word-splitting is intentional here).
[Unit]
Description=Early OOM Daemon (Guardian transport-defense config)

[Service]
ExecStart=
ExecStart=/bin/sh -c '/usr/bin/earlyoom ${EARLYOOM_ARGS}'
