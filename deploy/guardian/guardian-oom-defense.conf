# OOM defense for Guardian control-plane units.
# Layer 2 of the entry-capability defense stack (ROADMAP outcome 2, Layer 1):
# under global memory exhaustion the kernel OOM killer picks by oom_score;
# these adjustments keep the alerting and rescue path among the last
# candidates. sshd gets -1000 (never a candidate). guardian-runtime already
# carries OOMScoreAdjust=-900 in its unit - do NOT add a weaker drop-in for
# it. collector and the Feishu gateway get -800.
# Install as /etc/systemd/system/<unit>.service.d/guardian-oom-defense.conf
# for ssh.service (-1000), guardian-collector.service and the gateway (-800),
# then `systemctl daemon-reload` and restart the units (never restart sshd
# from a remote script).
[Service]
OOMScoreAdjust=-800
