name: server-resource-guardian-beszel-isolated

# Local-only acceptance stack. It deliberately uses different container names,
# volumes and a different host port from docker-compose.yml. A fresh Beszel
# Hub has no notification destinations until an operator adds them in the UI.
services:
  beszel-isolated:
    image: henrygd/beszel:0.19.0
    container_name: beszel-isolated-t12
    restart: unless-stopped
    environment:
      APP_URL: ${BESZEL_ISOLATED_APP_URL:-http://localhost:8091}
      CHECK_UPDATES: "false"
      CONTAINER_DETAILS: "false"
    ports:
      - "0.0.0.0:${BESZEL_ISOLATED_PORT:-8091}:8090"
    volumes:
      - beszel_isolated_data:/beszel_data
      - beszel_isolated_socket:/beszel_socket
    healthcheck:
      test: ["CMD", "/beszel", "health", "--url", "http://localhost:8090"]
      interval: 10s
      start_period: 10s
      timeout: 5s
      retries: 6

  beszel-agent-isolated:
    image: henrygd/beszel-agent:0.19.0
    container_name: beszel-agent-isolated-t12
    profiles: ["agent"]
    restart: unless-stopped
    network_mode: host
    depends_on:
      beszel-isolated:
        condition: service_healthy
    environment:
      LISTEN: /beszel_socket/beszel.sock
      HUB_URL: http://127.0.0.1:${BESZEL_ISOLATED_PORT:-8091}
      TOKEN: ${BESZEL_ISOLATED_AGENT_TOKEN:-}
      KEY: ${BESZEL_ISOLATED_AGENT_KEY:-}
    volumes:
      - beszel_isolated_agent_data:/var/lib/beszel-agent
      - beszel_isolated_socket:/beszel_socket
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket:ro
    healthcheck:
      test: ["CMD", "/agent", "health"]
      interval: 10s
      start_period: 10s
      timeout: 5s
      retries: 6

volumes:
  beszel_isolated_data:
  beszel_isolated_agent_data:
  beszel_isolated_socket:
