<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Times New Roman, SimSun, Songti SC" font-size="24" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF" /><g id="heading" data-pptx-bounds="64 35 1152 117"><text x="64" y="64" font-size="18" fill="#BC4733">候选组合 / Prometheus 路线</text><text x="64" y="137" font-size="42" fill="#181818" font-weight="bold">Prometheus + 按需补充的本机程序</text></g><line id="title-rule" data-pptx-role="decoration" x1="64" y1="163" x2="1216" y2="163" stroke="#DADADA" stroke-width="2" /><rect id="title-accent" data-pptx-role="decoration" x="64" y="161" width="64" height="4" fill="#BC4733" /><g id="intro" data-pptx-bounds="64 183 1152 43"><text x="64" y="213" fill="#181818">平台负责持续采集、历史与计算；本机程序负责授权复核、执行和恢复检查。</text></g><g id="collect" data-pptx-bounds="64 244 1152 102"><text x="80" y="274" font-size="28" fill="#181818" font-weight="bold">每台机器：提供数据</text><text x="80" y="309" fill="#181818">node_exporter：主机资源与压力；cAdvisor：容器用量与限流。</text><text x="80" y="338" font-size="18" fill="#666666">请求耗时、错误率等业务指标，需要应用或对应采集器提供。</text></g><g id="platform" data-pptx-bounds="64 356 1152 102"><text x="80" y="386" font-size="28" fill="#181818" font-weight="bold">Prometheus：存储与计算</text><text x="80" y="421" fill="#181818">定期拉取指标、保存历史；用 PromQL 筛选增长和组合条件。</text><text x="80" y="450" font-size="18" fill="#666666">可定期保存计算结果、判断告警；本机程序通过 API 查询结果。</text></g><g id="local" data-pptx-bounds="64 468 1152 102"><text x="80" y="498" font-size="28" fill="#BC4733" font-weight="bold">本机程序：补充未覆盖的保护逻辑</text><text x="80" y="533" fill="#181818">读取公司权限，复核当前风险与身份，再执行、检查、记录。</text><text x="80" y="562" font-size="18" fill="#666666">保留本机紧急检测；平台不可用或数据过期时，不依据旧结果盲目执行。</text></g><g id="optional" data-pptx-bounds="64 591 1152 80" font-size="18"><text x="64" y="613" fill="#181818">可选：Grafana 查询、展示与告警；Alertmanager 管理告警分组、去重和通知。</text><text x="64" y="638" fill="#181818">需要配置：采集目标、标签对应、查询 / 告警规则、保存时间和访问权限。</text><text x="64" y="662" fill="#666666">这里示例集中部署 Prometheus，也可另选部署位置；单机独立运行不保证远端数据始终新鲜。</text></g><g id="footer" data-pptx-role="footer" data-pptx-bounds="64 673 1152 27" font-size="16" fill="#666666"><text x="64" y="694">服务器资源保护 · 技术调研　｜　按需补充设计</text><text x="1216" y="694" text-anchor="end">19</text></g></svg>
