<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Times New Roman, SimSun, Songti SC" font-size="24" data-pptx-page-role="content">
<rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF"/>
<g id="heading" data-pptx-bounds="64 35 1152 117"><text x="64" y="64" font-size="18" fill="#BC4733">观测选型 / 数据与计算能力</text><text x="64" y="137" font-size="42" font-weight="bold">Beszel 与 Prometheus：数据如何支撑判断</text></g>
<line id="rule" data-pptx-role="decoration" x1="64" y1="163" x2="1216" y2="163" stroke="#DADADA" stroke-width="2"/>
<rect id="accent" data-pptx-role="decoration" x="64" y="161" width="64" height="4" fill="#BC4733"/>
<g id="thesis" data-pptx-bounds="64 182 1152 40"><text x="64" y="209" fill="#BC4733">两者都提供指标和历史，核心差异在于：能否灵活定义查询与计算。</text></g>
<g fill="#181818" id="comparison" data-pptx-bounds="64 231 1152 260">
<rect x="64" y="231" width="1152" height="44" fill="#F5F5F5"/>
<text x="80" y="261" font-weight="bold">比较维度</text><text x="286" y="261" font-weight="bold">Beszel</text><text x="766" y="261" font-weight="bold">Prometheus</text>
<text x="80" y="307" font-weight="bold">采集与历史</text><text x="286" y="307">配套 Agent 采集主机 / 容器指标<tspan x="286" dy="30">平台保存历史，API 可读取记录</tspan></text><text x="766" y="307">通常接入采集器或应用指标接口<tspan x="766" dy="30">保存时间序列，API 可查询结果</tspan></text>
<line x1="64" y1="351" x2="1216" y2="351" stroke="#DADADA"/>
<text x="80" y="382" font-weight="bold">计算能力</text><text x="286" y="382">提供既定统计、趋势查看与告警<tspan x="286" dy="30">复杂自定义计算通常由程序补充</tspan></text><text x="766" y="382">PromQL 自定义筛选、聚合与排序<tspan x="766" dy="30">记录规则可定期计算并保存结果</tspan></text>
<line x1="64" y1="426" x2="1216" y2="426" stroke="#DADADA"/>
<text x="80" y="457" font-weight="bold">更适合的需求</text><text x="286" y="457">基础监控与少量简单判断条件</text><text x="766" y="457">反复组合指标、复用历史计算结果</text>
<line x1="64" y1="480" x2="1216" y2="480" stroke="#DADADA"/>
</g>
<g fill="#181818" id="example" data-pptx-bounds="64 498 1152 114"><text x="64" y="521" font-size="18" fill="#666666">同题示例：筛选 10 分钟内存净增长、当前超过 2 GB 的容器，并按增长量排序（假设条件）</text><text x="80" y="560" font-weight="bold">谁完成计算</text><text x="286" y="560">程序读取历史记录<tspan x="286" dy="31" fill="#BC4733">程序计算增长、筛选并排序</tspan></text><text x="766" y="560">配置 PromQL 完成计算<tspan x="766" dy="31" fill="#BC4733">程序直接读取筛选与排序结果</tspan></text></g>
<g id="boundary" data-pptx-bounds="64 624 1152 37"><text x="64" y="648" font-size="18" fill="#666666">共同边界：业务授权、本机复核和恢复验证仍需实现；接口粒度、采集时效与配置成本需验证。</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="64 673 1152 27" font-size="16" fill="#666666"><text x="64" y="694">服务器资源保护 · 技术调研　｜　按需补充设计</text><text x="1216" y="694" text-anchor="end">12</text></g>
</svg>
