<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Times New Roman, SimSun, Songti SC" font-size="24" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF"/>
<g id="heading" data-pptx-bounds="64 35 1152 117" fill="#181818"><text x="64" y="64" font-size="18" fill="#BC4733">内存 / 完整应急处置案例</text><text x="64" y="137" font-size="42" font-weight="bold">内存应急：systemd-oomd 如何自动处置</text></g><line id="rule" data-pptx-role="decoration" x1="64" y1="163" x2="1216" y2="163" stroke="#DADADA" stroke-width="2"/><rect id="accent" data-pptx-role="decoration" x="64" y="161" width="64" height="4" fill="#BC4733"/>
<g id="intro" data-pptx-bounds="64 182 1152 42"><text x="64" y="211" fill="#BC4733">本机自行检测、选择与终止；不需要先接入监控平台，也无需重写同一套逻辑。</text></g>
<g id="trigger" data-pptx-bounds="64 245 1152 94" fill="#181818"><text x="64" y="276" font-size="28" font-weight="bold">何时触发</text><text x="375" y="276">内存压力超过阈值并持续指定时间；或满足 swap 条件。</text><text x="375" y="317" font-size="18" fill="#666666">PSI 衡量任务因内存等待的时间比例，不是内存占用百分比。</text></g>
<g id="selection" data-pptx-bounds="64 353 1152 94" fill="#181818"><text x="64" y="384" font-size="28" font-weight="bold">选择谁</text><text x="375" y="384">从监控范围内的合格子 cgroup 中，按内置规则选择。</text><text x="375" y="425" font-size="18" fill="#666666">压力路径参考回收活动；可配置 avoid / omit，作用范围需核验。</text></g>
<g id="action" data-pptx-bounds="64 461 1152 94" fill="#181818"><text x="64" y="492" font-size="28" font-weight="bold">如何执行</text><text x="375" y="492">对选中组的进程发送 SIGKILL，尽快释放内存。</text><text x="375" y="533" font-size="18" fill="#666666">这是强制终止；不提供保存进度、优雅退出或业务恢复验证。</text></g>
<g id="boundary" data-pptx-bounds="64 582 1152 81" fill="#181818"><rect x="64" y="582" width="1152" height="81" fill="#F5F5F5"/><text x="80" y="613">适用前提：允许牺牲部分负载，以缓解内存危机。</text><text x="80" y="648" font-size="18" fill="#666666">已核对 systemd 249 手册；仍需验证 Docker 分组、保护对象、swap 与自动重启行为。</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="64 673 1152 27" font-size="16" fill="#666666"><text x="64" y="694">来源：Ubuntu Jammy systemd-oomd / oomd.conf　｜　链接见备注</text><text x="1216" y="694" text-anchor="end">04</text></g></svg>
