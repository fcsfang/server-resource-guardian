<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Times New Roman, SimSun, Songti SC" font-size="24" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF"/>
<g id="heading" data-pptx-bounds="64 35 1152 117" fill="#181818"><text x="64" y="64" font-size="18" fill="#BC4733">磁盘空间 / 自动保留与清理</text><text x="64" y="137" font-size="42" font-weight="bold">磁盘空间：按数据归属自动治理</text></g><line id="rule" data-pptx-role="decoration" x1="64" y1="163" x2="1216" y2="163" stroke="#DADADA" stroke-width="2"/><rect id="accent" data-pptx-role="decoration" x="64" y="161" width="64" height="4" fill="#BC4733"/>
<g id="intro" data-pptx-bounds="64 182 1152 42"><text x="64" y="211" fill="#BC4733">日志有现成的轮转与保留策略；任意业务文件能否删除，仍需要明确规则。</text></g>
<g id="comparison" data-pptx-bounds="64 244 1152 326" fill="#181818"><rect x="64" y="244" width="1152" height="46" fill="#F5F5F5"/><text x="80" y="275" font-weight="bold">数据范围</text><text x="340" y="275" font-weight="bold">现成方案</text><text x="753" y="275" font-weight="bold">触发与动作</text>
<text x="80" y="329">容器标准输出日志</text><text x="340" y="329">Docker local 日志驱动</text><text x="753" y="329">按文件大小轮转，按数量保留</text><text x="340" y="359" font-size="18" fill="#666666">修改默认配置不会自动应用到既有容器</text><line x1="64" y1="378" x2="1216" y2="378" stroke="#DADADA"/>
<text x="80" y="414">系统 journal 日志</text><text x="340" y="414">journald</text><text x="753" y="414">按空间 / 保留规则回收归档日志</text><text x="340" y="444" font-size="18" fill="#666666">仅管理 journal；不能保证回收其他业务占用的空间</text><line x1="64" y1="463" x2="1216" y2="463" stroke="#DADADA"/>
<text x="80" y="499">明确路径的应用日志</text><text x="340" y="499">logrotate</text><text x="753" y="499">定时检查，按周期 / 大小轮转</text><text x="340" y="529" font-size="18" fill="#666666">配置路径、保留数量和应用重新打开日志的方式；检查频率影响时效</text></g>
<g id="boundary" data-pptx-bounds="64 589 1152 73" fill="#181818"><text x="64" y="616">尚需业务规则：数据集、模型文件、数据库及持久化卷的保留与删除。</text><text x="64" y="651" font-size="18" fill="#666666">先找清空间来源；停止容器不一定释放空间。不要把外部轮转工具直接用于 Docker 私有日志。</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="64 673 1152 27" font-size="16" fill="#666666"><text x="64" y="694">来源：Docker local、Ubuntu Jammy journald / logrotate　｜　链接见备注</text><text x="1216" y="694" text-anchor="end">07</text></g></svg>
