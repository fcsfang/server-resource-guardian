<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Times New Roman, SimSun, Songti SC" font-size="24" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF" /><g id="heading" fill="#181818" data-pptx-bounds="64 35 1152 117"><text x="64" y="64" font-size="18" fill="#BC4733">观测 / 按功能选择技术</text><text x="64" y="137" font-size="42" font-weight="bold">观测工具：定位前能拿到什么信息？</text><rect x="820" y="36" width="116" height="42" fill="#BC4733" /><text x="878" y="65" text-anchor="middle" fill="#FFFFFF">观测</text><rect x="960" y="36" width="116" height="42" fill="#F5F5F5" /><text x="1018" y="65" text-anchor="middle" fill="#666666">定位</text><rect x="1100" y="36" width="116" height="42" fill="#F5F5F5" /><text x="1158" y="65" text-anchor="middle" fill="#666666">处置</text></g><line id="title-rule" data-pptx-role="decoration" x1="64" y1="163" x2="1216" y2="163" stroke="#DADADA" stroke-width="2" /><rect id="title-accent" data-pptx-role="decoration" x="64" y="161" width="64" height="4" fill="#BC4733" />
<g id="task" fill="#666666" data-pptx-bounds="64 179 1152 36"><text x="64" y="204" font-size="18">先以直接读取本机为基线：平台额外提供哪些历史、计算和采集能力，能省下哪些工作？</text></g>
<g id="comparison" fill="#181818" data-pptx-bounds="64 222 1152 374"><rect x="64" y="222" width="1152" height="50" fill="#F5F5F5" /><text x="80" y="246" font-weight="bold">信息来源</text><text x="256" y="246" font-weight="bold">谁占得多？</text><text x="256" y="267" font-size="18" fill="#666666">当前用量 → 找对象</text><text x="454" y="246" font-weight="bold">谁持续增长？</text><text x="454" y="267" font-size="18" fill="#666666">变化历史 → 缩小范围</text><text x="724" y="246" font-weight="bold">资源真的紧张？</text><text x="724" y="267" font-size="18" fill="#666666">等待 / 限流 → 判断压力</text><text x="984" y="246" font-weight="bold">业务受影响？</text><text x="984" y="267" font-size="18" fill="#666666">耗时 / 错误 → 判断影响</text><rect x="64" y="273" width="1152" height="64" fill="#F5F5F5" /><text x="80" y="297" font-weight="bold">直接读本机</text><text x="80" y="322" font-size="18">Linux / Docker · 基线</text><text x="256" y="297">直接读当前用量<tspan x="256" dy="28">需自己对齐口径</tspan></text><text x="454" y="297">需连续采样保存<tspan x="454" dy="28">自己计算增长</tspan></text><text x="724" y="297">可直接读 PSI / 限流<tspan x="724" dy="28">需解析、对应容器</tspan></text><text x="984" y="297">需自己检查接口<tspan x="984" dy="28">或读取应用指标</tspan></text><line x1="64" y1="337" x2="1216" y2="337" stroke="#DADADA" /><text x="80" y="361" font-weight="bold">Beszel</text><text x="256" y="361">有容器用量<tspan x="256" dy="28">可供比较</tspan></text><text x="454" y="361">有历史记录<tspan x="454" dy="28">增长判断需自己补</tspan></text><text x="724" y="361">PSI / 限流未确认<tspan x="724" dy="28">需另核对或补采</tspan></text><text x="984" y="361">基础资源不够<tspan x="984" dy="28">需另接业务数据</tspan></text><line x1="64" y1="401" x2="1216" y2="401" stroke="#DADADA" /><text x="80" y="425" font-weight="bold">Prometheus</text><text x="80" y="450" font-size="18">＋配套采集器</text><text x="256" y="425">由容器采集器<tspan x="256" dy="28">提供用量</tspan></text><text x="454" y="425">写查询表达式<tspan x="454" dy="28">返回增长与排序结果</tspan></text><text x="724" y="425">主机 PSI、容器限流<tspan x="724" dy="28">需配对应采集器</tspan></text><text x="984" y="425">需应用提供指标<tspan x="984" dy="28">再配置采集</tspan></text><line x1="64" y1="465" x2="1216" y2="465" stroke="#DADADA" /><text x="80" y="489" font-weight="bold">Zabbix</text><text x="80" y="514" font-size="18">＋Agent 2 / 模板</text><text x="256" y="489">Docker 模板<tspan x="256" dy="28">提供容器用量</tspan></text><text x="454" y="489">有历史；可配置<tspan x="454" dy="28">计算项求变化</tspan></text><text x="724" y="489">模板有 CPU 限流<tspan x="724" dy="28">PSI 另核对或补采</tspan></text><text x="984" y="489">需接入应用数据<tspan x="984" dy="28">或配置接口检查</tspan></text><line x1="64" y1="529" x2="1216" y2="529" stroke="#DADADA" /><text x="80" y="553" font-weight="bold">Netdata</text><text x="80" y="578" font-size="18">本机 Agent</text><text x="256" y="553">本机采集<tspan x="256" dy="28">容器用量</tspan></text><text x="454" y="553">本机有历史与聚合<tspan x="454" dy="28">按增长筛选需再实现</tspan></text><text x="724" y="553">列有容器 PSI / 限流<tspan x="724" dy="28">目标环境需验证</tspan></text><text x="984" y="553">需启用应用集成<tspan x="984" dy="28">或接入应用指标</tspan></text></g><g id="selection" fill="#181818" font-size="18" data-pptx-bounds="64 602 1152 69"><text x="64" y="617">少量本机信息：直接读取；需要现成历史、更多采集项或查询计算：再复用采集器 / 平台。</text><text x="64" y="639" fill="#666666">已有信息够用就先复用；同样满足需求时，比较接入工作量、取数位置与组件开销。Monit 的现成恢复策略见第 8 页。</text><text x="64" y="661" fill="#666666">PSI 表示资源等待；字段、权限、时效和版本均需实测。业务信息仍需接入，允许动作仍由公司提供。</text></g><g id="footer" data-pptx-role="footer" data-pptx-bounds="64 673 1152 27" font-size="16" fill="#666666"><text x="64" y="694">服务器资源保护 · 技术调研　｜　按需补充设计</text><text x="1216" y="694" text-anchor="end">11</text></g></svg>
