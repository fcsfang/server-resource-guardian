<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Times New Roman, SimSun, Songti SC" font-size="24" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF"/>
<g id="heading" data-pptx-bounds="64 35 1152 117" fill="#181818"><text x="64" y="64" font-size="18" fill="#BC4733">补充路线 / 假设已有 Beszel 且基础信息够用</text><text x="64" y="137" font-size="42" font-weight="bold">Beszel + 按需补充的本机程序</text></g><line id="rule" data-pptx-role="decoration" x1="64" y1="163" x2="1216" y2="163" stroke="#DADADA" stroke-width="2"/><rect id="accent" data-pptx-role="decoration" x="64" y="161" width="64" height="4" fill="#BC4733"/>
<g id="platform" data-pptx-bounds="64 200 1152 116" fill="#181818"><text x="64" y="236" font-size="28" font-weight="bold">Beszel：复用指标、历史和告警</text><text x="64" y="279">Agent 提供主机与容器指标；平台保存记录，程序可通过 API 取数。</text><text x="64" y="309" font-size="18" fill="#666666">接口字段、历史粒度和数据年龄需核对实际版本。</text></g>
<g id="local" data-pptx-bounds="64 344 1152 135" fill="#181818"><rect x="64" y="344" width="1152" height="135" fill="#F5F5F5"/><text x="80" y="383" font-size="28" fill="#BC4733" font-weight="bold">本机程序：仅实现现成策略未覆盖的判断与动作</text><text x="80" y="427">按需计算历史变化，结合业务规则选候选；执行前读取本机最新状态。</text><text x="80" y="462" font-size="18" fill="#666666">缺失指标另行采集；恢复检查、冷却和动作记录按已确认需求补充。</text></g>
<g id="strategy" data-pptx-bounds="64 507 1152 78" fill="#181818"><text x="64" y="539" font-size="28" font-weight="bold">现成策略：继续承担已覆盖的保护职责</text><text x="64" y="577">资源限额、日志轮转及内存应急机制，与补充程序明确管理范围。</text></g>
<g id="boundary" data-pptx-bounds="64 614 1152 48" fill="#666666" font-size="18"><text x="64" y="640">“公司已有 Beszel”尚待确认；这是待验证的组合设计，不承诺额外程序的开销或响应时效。</text></g>
