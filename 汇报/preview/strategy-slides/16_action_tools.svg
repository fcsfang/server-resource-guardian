<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Times New Roman, SimSun, Songti SC" font-size="24" data-pptx-page-role="content">
<rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF" />
<g id="heading" data-pptx-bounds="64 35 1152 117" fill="#181818"><text x="64" y="64" font-size="18" fill="#BC4733">处置 / 具体工具与开发边界</text><text x="64" y="137" font-size="42" font-weight="bold">处置用什么工具：执行动作并验证恢复</text><rect x="820" y="36" width="116" height="42" fill="#F5F5F5" /><text x="878" y="65" text-anchor="middle" fill="#666666">观测</text><rect x="960" y="36" width="116" height="42" fill="#F5F5F5" /><text x="1018" y="65" text-anchor="middle" fill="#666666">定位</text><rect x="1100" y="36" width="116" height="42" fill="#BC4733" /><text x="1158" y="65" text-anchor="middle" fill="#FFFFFF">处置</text></g>
<line id="title-rule" data-pptx-role="decoration" x1="64" y1="163" x2="1216" y2="163" stroke="#DADADA" stroke-width="2" /><rect id="title-accent" data-pptx-role="decoration" x="64" y="161" width="64" height="4" fill="#BC4733" />
<g id="intro" data-pptx-bounds="64 180 1152 35"><text x="64" y="204" font-size="18" fill="#666666">输入是已筛选的候选；按职责复用工具，执行前仍需复核，执行后必须检查资源与业务。</text></g>
<g id="comparison" data-pptx-bounds="64 226 1152 357" fill="#181818">
<rect x="64" y="226" width="1152" height="44" fill="#F5F5F5" />
<text x="80" y="257" font-weight="bold">要做的工作</text><text x="286" y="257" font-weight="bold">具体工具 / 接口</text><text x="726" y="257" font-weight="bold">能得到什么，还缺什么</text>
<text x="80" y="301" font-weight="bold">执行前复核</text><text x="286" y="301">Docker Inspect＋本机 Linux 指标</text><text x="726" y="301">核对身份、状态与当前压力</text><text x="726" y="327" font-size="18" fill="#666666">同时复核业务授权；条件变化则退出</text><line x1="64" y1="337" x2="1216" y2="337" stroke="#DADADA" />
<text x="80" y="365" font-weight="bold">执行具体动作</text><text x="286" y="365">Docker update / stop / restart</text><text x="726" y="365">调整资源限制、停止或重启容器</text><text x="726" y="391" font-size="18" fill="#666666">调用对应 API；stop 超时可能升级为强制终止</text><line x1="64" y1="401" x2="1216" y2="401" stroke="#DADADA" />
<text x="80" y="429" font-weight="bold">控制并发与等待</text><text x="286" y="429">flock＋API 客户端超时</text><text x="726" y="429">协作式本机互斥、限制请求等待</text><text x="726" y="455" font-size="18" fill="#666666">需共用锁；请求超时不代表服务端动作取消</text><line x1="64" y1="465" x2="1216" y2="465" stroke="#DADADA" />
<text x="80" y="493" font-weight="bold">编排多步操作</text><text x="286" y="493">Ansible Playbook（可选）</text><text x="726" y="493">组织条件、等待、重试和失败分支</text><text x="726" y="519" font-size="18" fill="#666666">已有流程时复用；任务与跨运行互斥仍需定义</text><line x1="64" y1="529" x2="1216" y2="529" stroke="#DADADA" />
<text x="80" y="559" font-weight="bold" fill="#BC4733">验证是否恢复</text><text x="286" y="559">HEALTHCHECK / 业务接口＋指标</text><text x="726" y="559">检查关键业务健康和资源压力</text>
</g>
<g id="takeaway" data-pptx-bounds="64 601 1152 61"><text x="64" y="624" fill="#BC4733">仍需实现：授权复核、动作参数、冷却与次数上限、恢复标准和失败升级。</text><text x="64" y="652" font-size="18" fill="#666666">命令成功只说明动作完成；资源压力缓解且关键业务符合恢复标准，才算本次处置有效。</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="64 673 1152 27" font-size="16" fill="#666666"><text x="64" y="694">服务器资源保护 · 技术调研　｜　按需补充设计</text><text x="1216" y="694" text-anchor="end">16</text></g>
</svg>
