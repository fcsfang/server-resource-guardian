<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Times New Roman, SimSun, Songti SC" font-size="24" data-pptx-page-role="section"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF"/>
<g id="heading" data-pptx-bounds="64 35 1152 117" fill="#181818"><text x="64" y="64" font-size="18" fill="#BC4733">选型决策 / 是否需要补充开发</text><text x="64" y="137" font-size="42" font-weight="bold">现成方案是否满足需求？</text></g><line id="rule" data-pptx-role="decoration" x1="64" y1="163" x2="1216" y2="163" stroke="#DADADA" stroke-width="2"/><rect id="accent" data-pptx-role="decoration" x="64" y="161" width="64" height="4" fill="#BC4733"/>
<g id="criteria" data-pptx-bounds="64 199 1152 109" fill="#181818"><text x="64" y="230" font-size="28" font-weight="bold">先核对四项</text><text x="64" y="282">管理对象匹配　　触发与选择合理　　动作业务可接受　　效果可验证</text></g>
<g id="yes" data-pptx-bounds="64 341 540 159" fill="#181818"><text x="64" y="377" font-size="32" font-weight="bold">满足需求</text><text x="64" y="429">配置现成策略，选择试点验证。</text><text x="64" y="481" fill="#BC4733">跳至第 21 页：讨论试点与验收。</text></g>
<g id="gap" data-pptx-bounds="688 341 528 159" fill="#181818"><text x="688" y="377" font-size="32" font-weight="bold">存在明确缺口</text><text x="688" y="429">列出缺口，再选择需要补充的能力。</text><text x="688" y="481" fill="#BC4733">继续第 10—20 页：按需展开设计。</text></g>
<g id="examples" data-pptx-bounds="64 559 1152 104" fill="#181818"><rect x="64" y="559" width="1152" height="104" fill="#F5F5F5"/><text x="80" y="592">可能的缺口：终止前保存进度、特殊业务优先级、跨资源判断、业务恢复验证。</text><text x="80" y="635" font-size="18" fill="#666666">这些是待确认需求，不能据此预先认定现成方案不够用，也不据此估算开发量。</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="64 673 1152 27" font-size="16" fill="#666666"><text x="64" y="694">服务器资源保护 · 技术调研　｜　决策点</text><text x="1216" y="694" text-anchor="end">09</text></g></svg>
