<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Times New Roman, SimSun, Songti SC" font-size="24" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF"/>
<g id="heading" data-pptx-bounds="64 35 1152 117" fill="#181818"><text x="64" y="64" font-size="18" fill="#BC4733">CPU / 磁盘 IO / 进程与线程数量</text><text x="64" y="137" font-size="42" font-weight="bold">CPU、磁盘 IO 与进程数量：持续限制</text></g><line id="rule" data-pptx-role="decoration" x1="64" y1="163" x2="1216" y2="163" stroke="#DADADA" stroke-width="2"/><rect id="accent" data-pptx-role="decoration" x="64" y="161" width="64" height="4" fill="#BC4733"/>
<g id="intro" data-pptx-bounds="64 182 1152 44"><text x="64" y="211" fill="#BC4733">提前声明每组负载的资源预算，由内核持续执行，不需要自写循环下发限额。</text></g>
<g id="comparison" data-pptx-bounds="64 245 1152 296" fill="#181818"><rect x="64" y="245" width="1152" height="46" fill="#F5F5F5"/><text x="80" y="276" font-weight="bold">资源</text><text x="290" y="276" font-weight="bold">现成配置</text><text x="754" y="276" font-weight="bold">自动执行与边界</text>
<text x="80" y="330" font-weight="bold">CPU</text><text x="290" y="330">Docker CPU 限额 / 权重<tspan x="290" dy="33">systemd CPUQuota / CPUWeight</tspan></text><text x="754" y="330">限制 CPU 时间，竞争时按权重分配<tspan x="754" dy="33">高利用率本身不代表必须停止任务</tspan></text><line x1="64" y1="389" x2="1216" y2="389" stroke="#DADADA"/>
<text x="80" y="426" font-weight="bold">磁盘 IO</text><text x="290" y="426">systemd IO 带宽 / IOPS 限制<tspan x="290" dy="33">底层由 cgroup 控制器执行</tspan></text><text x="754" y="426">按设备限制任务的读写吞吐<tspan x="754" dy="33">不清理文件，也不增加可用空间</tspan></text><line x1="64" y1="485" x2="1216" y2="485" stroke="#DADADA"/>
<text x="80" y="522" font-weight="bold">进程 / 线程</text><text x="290" y="522">Docker pids-limit / TasksMax</text><text x="754" y="522">达到上限后阻止继续创建任务</text></g>
<g id="config" data-pptx-bounds="64 575 1152 88" fill="#181818"><text x="64" y="603">需要配置：管理对象、资源预算和优先级；需要验证：业务性能与实际生效范围。</text><text x="64" y="640" font-size="18" fill="#666666">Docker 管理的容器优先通过其配置施加限制；systemd 与容器管理器的 cgroup 归属需协调。</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="64 673 1152 27" font-size="16" fill="#666666"><text x="64" y="694">来源：Docker 资源限制、systemd 249 资源控制　｜　链接见备注</text><text x="1216" y="694" text-anchor="end">06</text></g></svg>
