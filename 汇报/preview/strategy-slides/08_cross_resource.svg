<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Times New Roman, SimSun, Songti SC" font-size="24" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF"/>
<g id="heading" data-pptx-bounds="64 35 1152 117" fill="#181818"><text x="64" y="64" font-size="18" fill="#BC4733">跨资源 / 按管理对象选择</text><text x="64" y="137" font-size="42" font-weight="bold">跨资源方案：按工作负载选择</text></g><line id="rule" data-pptx-role="decoration" x1="64" y1="163" x2="1216" y2="163" stroke="#DADADA" stroke-width="2"/><rect id="accent" data-pptx-role="decoration" x="64" y="161" width="64" height="4" fill="#BC4733"/>
<g id="intro" data-pptx-bounds="64 182 1152 42"><text x="64" y="211" fill="#BC4733">固定服务恢复、容器编排、离线任务调度，分别已有相应的策略执行体系。</text></g>
<g id="comparison" data-pptx-bounds="64 245 1152 323" fill="#181818"><rect x="64" y="245" width="1152" height="46" fill="#F5F5F5"/><text x="80" y="276" font-weight="bold">方案 / 对象</text><text x="367" y="276" font-weight="bold">已有策略</text><text x="822" y="276" font-weight="bold">采用前提与边界</text>
<text x="80" y="331" font-weight="bold">Monit</text><text x="80" y="364" font-size="18" fill="#666666">固定服务</text><text x="367" y="331">资源 / 健康条件持续满足时<tspan x="367" dy="33">执行已配置的停止或重启</tspan></text><text x="822" y="331">明确对象、条件和动作<tspan x="822" dy="33">动态容器管理需适配</tspan></text><line x1="64" y1="389" x2="1216" y2="389" stroke="#DADADA"/>
<text x="80" y="427" font-weight="bold">Kubernetes</text><text x="80" y="460" font-size="18" fill="#666666">Pod / 节点</text><text x="367" y="427">内存、磁盘等压力触发回收<tspan x="367" dy="33">或驱逐；控制器按声明补建</tspan></text><text x="822" y="427">工作负载纳入 K8s 管理<tspan x="822" dy="33">CPU 高占用非同类驱逐信号</tspan></text><line x1="64" y1="485" x2="1216" y2="485" stroke="#DADADA"/>
<text x="80" y="523" font-weight="bold">Slurm</text><text x="80" y="556" font-size="18" fill="#666666">CPU / 内存 / GPU 作业</text><text x="367" y="523">申请、排队、分配与约束<tspan x="367" dy="33">按配置抢占低优先级任务</tspan></text><text x="822" y="523">作业通过调度器提交<tspan x="822" dy="33">暂停不等于释放内存 / GPU</tspan></text></g>
<g id="selection" data-pptx-bounds="64 597 1152 65" fill="#181818"><text x="64" y="625">当前先评估本机策略；确有统一调度需求时，再比较迁移与管理成本。</text><text x="64" y="652" font-size="18" fill="#666666">这些系统不会安装后自动接管所有现有 Docker 任务，不能直接当作即插即用的替代品。</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="64 673 1152 27" font-size="16" fill="#666666"><text x="64" y="694">来源：Monit、Kubernetes 节点压力驱逐、Slurm 文档　｜　链接见备注</text><text x="1216" y="694" text-anchor="end">08</text></g></svg>
