<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Times New Roman, SimSun, Songti SC" font-size="24" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF" /><g id="heading" data-pptx-bounds="64 35 1152 117"><text x="64" y="64" font-size="18" fill="#BC4733">候选组合 / Prometheus 路线</text><text x="64" y="137" font-size="42" fill="#181818" font-weight="bold">同一次内存危机：谁完成哪些判断？</text></g><line id="title-rule" data-pptx-role="decoration" x1="64" y1="163" x2="1216" y2="163" stroke="#DADADA" stroke-width="2" /><rect id="title-accent" data-pptx-role="decoration" x="64" y="161" width="64" height="4" fill="#BC4733" /><g id="scenario" data-pptx-bounds="64 183 1152 43"><text x="64" y="213" fill="#181818">仍用假设案例：S1 内存紧张；B 是可中断离线任务，A 是受保护数据库。</text></g><g id="step01" data-pptx-bounds="64 243 1152 64"><text x="64" y="269" fill="#181818" font-weight="bold">01  持续记录</text><text x="330" y="269" fill="#181818">采集器 + 平台</text><text x="330" y="298" font-size="18" fill="#666666">保存可用内存、容器用量、压力；应用指标按需接入。</text></g><g id="step02" data-pptx-bounds="64 311 1152 64"><text x="64" y="337" fill="#181818" font-weight="bold">02  筛出线索</text><text x="330" y="337" fill="#BC4733">Prometheus</text><text x="330" y="366" font-size="18" fill="#666666">按配置计算近期增长，返回 B 等对象的数值线索；尚未完成业务候选判断。</text></g><g id="step03" data-pptx-bounds="64 379 1152 64"><text x="64" y="405" fill="#181818" font-weight="bold">03  确认能处理</text><text x="330" y="405" fill="#181818">本机程序</text><text x="330" y="434" font-size="18" fill="#666666">核对数据年龄、完整身份与公司权限；排除 A 和未知业务。</text></g><g id="step04" data-pptx-bounds="64 447 1152 64"><text x="64" y="473" fill="#181818" font-weight="bold">04  复核后执行</text><text x="330" y="473" fill="#181818">本机程序</text><text x="330" y="502" font-size="18" fill="#666666">风险仍在才按授权停止 B；设超时、互斥与次数上限。</text></g><g id="step05" data-pptx-bounds="64 515 1152 64"><text x="64" y="541" fill="#181818" font-weight="bold">05  检查并留痕</text><text x="330" y="541" fill="#181818">本机程序</text><text x="330" y="570" font-size="18" fill="#666666">本机复查压力与业务；平台趋势辅助复盘，失败则升级。</text></g><g id="boundary" data-pptx-bounds="64 599 1152 67"><text x="64" y="622" fill="#BC4733">先验证查询取数；告警联动按需加入，收到通知仍需本机复核。</text><text x="64" y="651" font-size="18" fill="#666666">增长排名不是根因或停止许可；阈值、窗口、采样间隔和失联处理需在试点中确定。</text></g><g id="footer" data-pptx-role="footer" data-pptx-bounds="64 673 1152 27" font-size="16" fill="#666666"><text x="64" y="694">服务器资源保护 · 技术调研　｜　按需补充设计</text><text x="1216" y="694" text-anchor="end">20</text></g></svg>
