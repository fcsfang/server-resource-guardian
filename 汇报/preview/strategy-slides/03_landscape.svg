<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Times New Roman, SimSun, Songti SC" font-size="24" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF"/>
<g id="heading" data-pptx-bounds="64 35 1152 117" fill="#181818"><text x="64" y="64" font-size="18" fill="#BC4733">第一部分 / 现成资源保护方案</text><text x="64" y="137" font-size="42" font-weight="bold">现成策略：先按资源选择</text></g><line id="rule" data-pptx-role="decoration" x1="64" y1="163" x2="1216" y2="163" stroke="#DADADA" stroke-width="2"/><rect id="accent" data-pptx-role="decoration" x="64" y="161" width="64" height="4" fill="#BC4733"/>
<g id="intro" data-pptx-bounds="64 180 1152 39"><text x="64" y="207" fill="#BC4733">配置后自动执行的策略，既包括应急处置，也包括持续限制与自动清理。</text></g>
<g id="comparison" data-pptx-bounds="64 236 1152 330" fill="#181818"><rect x="64" y="236" width="1152" height="46" fill="#F5F5F5"/><text x="80" y="267" font-weight="bold">资源问题</text><text x="350" y="267" font-weight="bold">现成方案</text><text x="790" y="267" font-weight="bold">自动完成什么</text>
<text x="80" y="320">内存压力</text><text x="350" y="320">systemd-oomd / earlyoom</text><text x="790" y="320">检测、选择对象、终止</text><line x1="64" y1="343" x2="1216" y2="343" stroke="#DADADA"/>
<text x="80" y="380">CPU / IO / 任务数</text><text x="350" y="380">Docker / systemd 资源限制</text><text x="790" y="380">持续限额、分配或阻止增长</text><line x1="64" y1="403" x2="1216" y2="403" stroke="#DADADA"/>
<text x="80" y="440">磁盘空间</text><text x="350" y="440">日志驱动 / journald / logrotate</text><text x="790" y="440">按范围轮转、保留与清理</text><line x1="64" y1="463" x2="1216" y2="463" stroke="#DADADA"/>
<text x="80" y="500">固定服务多种异常</text><text x="350" y="500">Monit</text><text x="790" y="500">条件检查、执行预配置恢复</text><line x1="64" y1="523" x2="1216" y2="523" stroke="#DADADA"/>
<text x="80" y="558">多机 / 多用户争抢</text><text x="350" y="558">Kubernetes / Slurm</text><text x="790" y="558">统一管理下的驱逐或调度</text></g>
<g id="boundary" data-pptx-bounds="64 598 1152 64" fill="#666666" font-size="18"><text x="64" y="621">共同评价：管理对象、触发条件、选择规则、执行动作、配置成本，以及覆盖边界。</text><text x="64" y="652">“完整”只针对明确的保护范围；现成策略也需要业务配置与目标环境验证。</text></g>
