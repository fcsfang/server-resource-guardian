<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Times New Roman, SimSun, Songti SC" font-size="24" data-pptx-page-role="section"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF"/>
<g id="heading" data-pptx-bounds="64 35 1152 117" fill="#181818"><text x="64" y="64" font-size="18" fill="#BC4733">第二部分 / 现成方案不足时的补充设计</text><text x="64" y="137" font-size="42" font-weight="bold">补充设计：观测、定位、处置如何协作</text></g><line id="rule" data-pptx-role="decoration" x1="64" y1="163" x2="1216" y2="163" stroke="#DADADA" stroke-width="2"/><rect id="accent" data-pptx-role="decoration" x="64" y="161" width="64" height="4" fill="#BC4733"/>
<g id="intro" data-pptx-bounds="64 182 1152 42"><text x="64" y="211" fill="#BC4733">只补已确认的缺口；三段之间传递结构化字段，不依赖自然语言理解。</text></g>
<g id="observe" data-pptx-bounds="64 251 1152 95" fill="#181818"><text x="64" y="283" font-size="28" font-weight="bold">观测：提供证据</text><text x="409" y="283">对象 ID、当前用量、变化、压力、采集时间与有效性。</text><text x="409" y="323" font-size="18" fill="#666666">先复用平台或本机数据；“B 增长多”属于可计算的指标证据。</text></g>
<g id="locate" data-pptx-bounds="64 359 1152 95" fill="#181818"><text x="64" y="391" font-size="28" font-weight="bold">定位：选择候选</text><text x="409" y="391">证据结合公司权限与规则，输出候选、依据和建议动作。</text><text x="409" y="431" font-size="18" fill="#666666">“B 符合处理规则”是决策；证据不足时补查，也允许返回无候选。</text></g>
<g id="act" data-pptx-bounds="64 467 1152 95" fill="#181818"><text x="64" y="499" font-size="28" font-weight="bold">处置：执行并验证</text><text x="409" y="499">执行前复核，调用动作接口，输出执行与恢复检查结果。</text><text x="409" y="539" font-size="18" fill="#666666">命令成功不等于恢复；本机当前状态与关键业务均需确认。</text></g>
<g id="boundary" data-pptx-bounds="64 596 1152 66" font-size="18" fill="#666666"><text x="64" y="621">同一组件可承担多个职责；已有 systemd-oomd 等策略已覆盖的流程，无需重复实现。</text><text x="64" y="651">若现成执行器与补充程序共同运行，需要明确管理范围、动作优先级和防重复规则。</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="64 673 1152 27" font-size="16" fill="#666666"><text x="64" y="694">服务器资源保护 · 技术调研　｜　按需补充设计</text><text x="1216" y="694" text-anchor="end">10</text></g></svg>
