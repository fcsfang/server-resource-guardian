<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Times New Roman, SimSun, Songti SC" font-size="24" data-pptx-page-role="content">
<rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF" />
<g id="heading" data-pptx-bounds="64 35 1152 117" fill="#181818"><text x="64" y="64" font-size="18" fill="#BC4733">定位 / 具体工具与开发边界</text><text x="64" y="137" font-size="42" font-weight="bold">定位用什么工具：把观测数据变成候选</text><rect x="820" y="36" width="116" height="42" fill="#F5F5F5" /><text x="878" y="65" text-anchor="middle" fill="#666666">观测</text><rect x="960" y="36" width="116" height="42" fill="#BC4733" /><text x="1018" y="65" text-anchor="middle" fill="#FFFFFF">定位</text><rect x="1100" y="36" width="116" height="42" fill="#F5F5F5" /><text x="1158" y="65" text-anchor="middle" fill="#666666">处置</text></g>
<line id="title-rule" data-pptx-role="decoration" x1="64" y1="163" x2="1216" y2="163" stroke="#DADADA" stroke-width="2" /><rect id="title-accent" data-pptx-role="decoration" x="64" y="161" width="64" height="4" fill="#BC4733" />
<g id="intro" data-pptx-bounds="64 180 1152 35"><text x="64" y="204" font-size="18" fill="#666666">先复用观测的结构化数据，缺证据再补查；以下工具按职责组合，无需每次全部调用。</text></g>
<g id="comparison" data-pptx-bounds="64 226 1152 357" fill="#181818">
<rect x="64" y="226" width="1152" height="44" fill="#F5F5F5" />
<text x="80" y="257" font-weight="bold">要做的工作</text><text x="286" y="257" font-weight="bold">具体工具 / 接口</text><text x="726" y="257" font-weight="bold">能得到什么，还缺什么</text>
<text x="80" y="301" font-weight="bold">读取已有证据</text><text x="286" y="301">Beszel / Prometheus HTTP API</text><text x="726" y="301">读取记录、指标或查询结果</text><text x="726" y="327" font-size="18" fill="#666666">复用观测成果；本机观测数据也可直接接入</text><line x1="64" y1="337" x2="1216" y2="337" stroke="#DADADA" />
<text x="80" y="365" font-weight="bold">按数值筛选</text><text x="286" y="365">PromQL（Prometheus）</text><text x="726" y="365">按表达式计算增长、筛选与排序</text><text x="726" y="391" font-size="18" fill="#666666">输出指标证据；表达式和业务取舍需定义</text><line x1="64" y1="401" x2="1216" y2="401" stroke="#DADADA" />
<text x="80" y="429" font-weight="bold">核对对象身份</text><text x="286" y="429">Docker Inspect API / 命令</text><text x="726" y="429">核对容器 ID、状态和标签</text><text x="726" y="455" font-size="18" fill="#666666">关联具体对象；标签本身不等于操作许可</text><line x1="64" y1="465" x2="1216" y2="465" stroke="#DADADA" />
<text x="80" y="493" font-weight="bold">证据不足补查</text><text x="286" y="493">pidstat（sysstat）、/proc</text><text x="726" y="493">补查宿主机进程的 CPU / 内存 / IO</text><text x="726" y="519" font-size="18" fill="#666666">按需使用；安装、权限及进程归属需核验</text><line x1="64" y1="529" x2="1216" y2="529" stroke="#DADADA" />
<text x="80" y="559" font-weight="bold" fill="#BC4733">生成业务候选</text><text x="286" y="559">公司配置＋本机规则（需自研）</text><text x="726" y="559">过滤保护对象、确定优先级或无候选</text>
</g>
<g id="takeaway" data-pptx-bounds="64 601 1152 61"><text x="64" y="624" fill="#BC4733">观测：“B 增长多”是证据；定位：“B 符合候选规则”是决策。</text><text x="64" y="652" font-size="18" fill="#666666">交给处置：对象 ID、指标依据、规则编号、建议动作；仍需执行前复核，候选不等于根因。</text></g>
<g id="footer" data-pptx-role="footer" data-pptx-bounds="64 673 1152 27" font-size="16" fill="#666666"><text x="64" y="694">服务器资源保护 · 技术调研　｜　按需补充设计</text><text x="1216" y="694" text-anchor="end">14</text></g>
</svg>
