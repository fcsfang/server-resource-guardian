<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Times New Roman, SimSun, Songti SC" font-size="24" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF" /><g id="heading" data-pptx-bounds="64 35 1152 117"><text x="64" y="64" font-size="18" fill="#BC4733">候选组合 / Prometheus 路线</text><text x="64" y="137" font-size="42" fill="#181818" font-weight="bold">两条补充路线：省下什么，增加什么？</text></g><line id="title-rule" data-pptx-role="decoration" x1="64" y1="163" x2="1216" y2="163" stroke="#DADADA" stroke-width="2" /><rect id="title-accent" data-pptx-role="decoration" x="64" y="161" width="64" height="4" fill="#BC4733" /><g id="intro" data-pptx-bounds="64 182 1152 38"><text x="64" y="209" font-size="18" fill="#666666">比较相同目标：识别风险、选出允许处理的对象，并执行后检查恢复。</text></g><g id="comparison" data-pptx-bounds="64 223 1152 353"><rect x="64" y="223" width="1152" height="47" fill="#F5F5F5" /><text x="80" y="254" fill="#181818" font-weight="bold">比较维度</text><text x="286" y="254" fill="#181818" font-weight="bold">Beszel + 本机程序</text><text x="766" y="254" fill="#181818" font-weight="bold">Prometheus + 本机程序</text><text x="80" y="303" fill="#181818" font-weight="bold">复用什么</text><text x="286" y="303" fill="#181818">基础用量、历史、集中查看与告警；<tspan x="286" dy="32">可通过 API 读取已保存记录。</tspan></text><text x="766" y="303" fill="#181818">采集器、历史、表达式查询；<tspan x="766" dy="32">计算结果复用与告警规则。</tspan></text><line x1="64" y1="349" x2="1216" y2="349" stroke="#DADADA" /><text x="80" y="376" fill="#181818" font-weight="bold">判断放哪里</text><text x="286" y="376" fill="#181818">本机程序做紧急检测与候选判断；<tspan x="286" dy="32">需要时读取 Beszel 历史。</tspan></text><text x="766" y="376" fill="#181818">增长筛选与组合条件可放平台；<tspan x="766" dy="32">业务授权与执行前复核留本机。</tspan></text><line x1="64" y1="422" x2="1216" y2="422" stroke="#DADADA" /><text x="80" y="449" fill="#181818" font-weight="bold">需要补什么</text><text x="286" y="449" fill="#181818">本机采样 / 历史处理按需补；<tspan x="286" dy="32">平台缺少的指标另接。</tspan></text><text x="766" y="449" fill="#181818">采集器、标签与表达式需配置；<tspan x="766" dy="32">业务指标与采集时效需核验。</tspan></text><line x1="64" y1="495" x2="1216" y2="495" stroke="#DADADA" /><text x="80" y="522" fill="#181818" font-weight="bold">更适合何时</text><text x="286" y="522" fill="#181818">公司已有 Beszel，基础信息够用，<tspan x="286" dy="32">希望先验证少量本机保护条件。</tspan></text><text x="766" y="522" fill="#181818">需要反复组合资源与业务指标，<tspan x="766" dy="32">或公司已有 Prometheus 体系。</tspan></text></g><g id="shared" data-pptx-bounds="64 588 1152 83"><text x="64" y="612" fill="#BC4733">两条路线都需：公司业务配置、动作控制、恢复检查、操作记录和目标环境测试。</text><text x="64" y="639" font-size="18" fill="#666666">平台计算可减少部分处理代码，但不能预先断言总开发量更少、响应更快或一定更可靠。</text><text x="64" y="662" font-size="18" fill="#666666">先在同机同负载下比较数据齐全程度、时效、组件开销和开发缺口，再决定采用或组合。</text></g><g id="footer" data-pptx-role="footer" data-pptx-bounds="64 673 1152 27" font-size="16" fill="#666666"><text x="64" y="694">服务器资源保护 · 技术调研　｜　按需补充设计</text><text x="1216" y="694" text-anchor="end">17</text></g></svg>
