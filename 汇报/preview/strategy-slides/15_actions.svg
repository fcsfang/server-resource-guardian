<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Times New Roman, SimSun, Songti SC" font-size="24" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF" /><g id="heading" fill="#181818" data-pptx-bounds="64 35 1152 117"><text x="64" y="64" font-size="18" fill="#BC4733">处置 / 按功能选择技术</text><text x="64" y="137" font-size="42" font-weight="bold">处置：缓解风险，并检查恢复</text><rect x="820" y="36" width="116" height="42" fill="#F5F5F5" /><text x="878" y="65" text-anchor="middle" fill="#666666">观测</text><rect x="960" y="36" width="116" height="42" fill="#F5F5F5" /><text x="1018" y="65" text-anchor="middle" fill="#666666">定位</text><rect x="1100" y="36" width="116" height="42" fill="#BC4733" /><text x="1158" y="65" text-anchor="middle" fill="#FFFFFF">处置</text></g><line id="title-rule" data-pptx-role="decoration" x1="64" y1="163" x2="1216" y2="163" stroke="#DADADA" stroke-width="2" /><rect id="title-accent" data-pptx-role="decoration" x="64" y="161" width="64" height="4" fill="#BC4733" />
<g id="input" data-pptx-bounds="64 185 1152 58"><text x="64" y="215" fill="#181818">假设场景：输入候选 B 和允许动作；还需确认现在是否应当执行。</text></g><g id="recheck" data-pptx-bounds="64 252 1152 88"><text x="64" y="284" font-size="28" fill="#181818" font-weight="bold">执行前复核</text><text x="380" y="282" fill="#181818">风险仍在、B 身份未变、权限有效，且没有重复动作。</text><text x="380" y="318" font-size="18" fill="#666666">风险消失就取消；目标改变就返回定位；不直接信任过期告警。</text></g><g id="action" data-pptx-bounds="64 349 1152 88"><text x="64" y="381" font-size="28" fill="#181818" font-weight="bold">执行并控制失败</text><text x="380" y="379" fill="#181818">通过 Docker 执行约定动作，设置等待时间和尝试上限。</text><text x="380" y="415" font-size="18" fill="#666666">CPU 可限额，内存可停止授权任务；磁盘清理必须另有允许范围。</text></g><g id="verify" data-pptx-bounds="64 446 1152 88"><text x="64" y="478" font-size="28" fill="#181818" font-weight="bold">检查资源与业务</text><text x="380" y="476" fill="#181818">重新读取内存压力，并检查关键业务是否恢复。</text><text x="380" y="512" font-size="18" fill="#666666">命令成功只说明操作完成；不能据此认定危机已经解除。</text></g><g id="output" data-pptx-bounds="64 555 1152 105"><rect x="64" y="555" width="1152" height="105" fill="#F5F5F5" /><text x="80" y="587" fill="#BC4733" font-weight="bold">交出结果</text><text x="265" y="587" fill="#181818">对象 ID=B，执行状态=完成，资源检查=通过，业务检查=通过。</text><text x="80" y="621" font-size="18" fill="#181818">未改善或执行失败：记录并升级处理；达到恢复条件后，再按约定恢复任务或解除限制。</text><text x="80" y="648" font-size="18" fill="#666666">保留原因、动作和前后结果；设置冷却，并与 Docker / systemd 自动拉起协调。</text></g><g id="footer" data-pptx-role="footer" data-pptx-bounds="64 673 1152 27" font-size="16" fill="#666666"><text x="64" y="694">服务器资源保护 · 技术调研　｜　按需补充设计</text><text x="1216" y="694" text-anchor="end">15</text></g></svg>
