<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Times New Roman, SimSun, Songti SC" font-size="24" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF" /><g id="heading" fill="#181818" data-pptx-bounds="64 35 1152 117"><text x="64" y="64" font-size="18" fill="#BC4733">定位 / 按功能选择技术</text><text x="64" y="137" font-size="42" font-weight="bold">定位：交出可处理的候选</text><rect x="820" y="36" width="116" height="42" fill="#F5F5F5" /><text x="878" y="65" text-anchor="middle" fill="#666666">观测</text><rect x="960" y="36" width="116" height="42" fill="#BC4733" /><text x="1018" y="65" text-anchor="middle" fill="#FFFFFF">定位</text><rect x="1100" y="36" width="116" height="42" fill="#F5F5F5" /><text x="1158" y="65" text-anchor="middle" fill="#666666">处置</text></g><line id="title-rule" data-pptx-role="decoration" x1="64" y1="163" x2="1216" y2="163" stroke="#DADADA" stroke-width="2" /><rect id="title-accent" data-pptx-role="decoration" x="64" y="161" width="64" height="4" fill="#BC4733" />
<g id="input" data-pptx-bounds="64 185 1152 58"><text x="64" y="215" fill="#181818">假设场景：S1 内存持续紧张；观测以结构化字段提供用量、增长与压力。</text></g><g id="identity" data-pptx-bounds="64 255 1152 87"><text x="64" y="287" font-size="28" fill="#181818" font-weight="bold">确认是谁</text><text x="405" y="285" fill="#181818">B 的完整容器身份、所属业务和当前状态。</text><text x="405" y="321" font-size="18" fill="#666666">避免把旧记录对应到重建后的另一个容器。</text></g><g id="benefit" data-pptx-bounds="64 352 1152 87"><text x="64" y="384" font-size="28" fill="#181818" font-weight="bold">判断处理是否有用</text><text x="405" y="382" fill="#181818">B 近期净增长，停止后可能释放内存。</text><text x="405" y="418" font-size="18" fill="#666666">这是缓解风险的依据，不代表已经证明事故根因。</text></g><g id="permission" data-pptx-bounds="64 449 1152 87"><text x="64" y="481" font-size="28" fill="#181818" font-weight="bold">核对能否处理</text><text x="405" y="479" fill="#181818">B 是可中断的离线任务；A 是受保护数据库。</text><text x="405" y="515" font-size="18" fill="#666666">权限与优先级由公司提供；未知业务不进入自动处理名单。</text></g><g id="output" data-pptx-bounds="64 558 1152 102"><rect x="64" y="558" width="1152" height="102" fill="#F5F5F5" /><text x="80" y="589" fill="#BC4733" font-weight="bold">交出候选</text><text x="265" y="589" fill="#181818">容器 ID=B，建议动作=stop，依据=资源指标＋业务规则。</text><text x="80" y="624" font-size="18" fill="#181818">附上身份、依据、允许动作与处理顺序；没有安全候选就告警，交给人工。</text><text x="80" y="649" font-size="18" fill="#666666">候选不等于执行许可：处置前还要复核风险、身份和最新权限。</text></g><g id="footer" data-pptx-role="footer" data-pptx-bounds="64 673 1152 27" font-size="16" fill="#666666"><text x="64" y="694">服务器资源保护 · 技术调研　｜　按需补充设计</text><text x="1216" y="694" text-anchor="end">13</text></g></svg>
