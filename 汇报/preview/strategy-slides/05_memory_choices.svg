<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Times New Roman, SimSun, Songti SC" font-size="24" data-pptx-page-role="content"><rect id="bg" data-pptx-role="background" width="1280" height="720" fill="#FFFFFF"/>
<g id="heading" data-pptx-bounds="64 35 1152 117" fill="#181818"><text x="64" y="64" font-size="18" fill="#BC4733">内存 / 同一目标比较</text><text x="64" y="137" font-size="42" font-weight="bold">内存保护：三种现成策略怎么选</text></g><line id="rule" data-pptx-role="decoration" x1="64" y1="163" x2="1216" y2="163" stroke="#DADADA" stroke-width="2"/><rect id="accent" data-pptx-role="decoration" x="64" y="161" width="64" height="4" fill="#BC4733"/>
<g id="intro" data-pptx-bounds="64 184 1152 36"><text x="64" y="208" font-size="18" fill="#666666">共同目标：在内存危机中自动选择可牺牲对象；重点比较管理粒度和策略适配。</text></g>
<g id="comparison" data-pptx-bounds="64 239 1152 311" fill="#181818"><rect x="64" y="239" width="1152" height="46" fill="#F5F5F5"/><text x="80" y="270" font-weight="bold">方案</text><text x="310" y="270" font-weight="bold">触发与对象</text><text x="642" y="270" font-weight="bold">选择与执行</text><text x="972" y="270" font-weight="bold">适用方向</text>
<text x="80" y="322" font-weight="bold">systemd-oomd</text><text x="310" y="322">PSI / swap 条件<tspan x="310" dy="32">管理 cgroup</tspan></text><text x="642" y="322">内置选择规则<tspan x="642" dy="32">整组强制终止</tspan></text><text x="972" y="322">适合组级保护<tspan x="972" dy="32">先核验容器层级</tspan></text><line x1="64" y1="378" x2="1216" y2="378" stroke="#DADADA"/>
<text x="80" y="413" font-weight="bold">earlyoom</text><text x="310" y="413">可用内存 / swap<tspan x="310" dy="32">管理进程</tspan></text><text x="642" y="413">oom_score 与偏好<tspan x="642" dy="32">发送终止信号</tspan></text><text x="972" y="413">进程级保护<tspan x="972" dy="32">需核对业务映射</tspan></text><line x1="64" y1="469" x2="1216" y2="469" stroke="#DADADA"/>
<text x="80" y="504" font-weight="bold">Meta oomd</text><text x="310" y="504">PSI / cgroup v2<tspan x="310" dy="32">规则与插件配置</tspan></text><text x="642" y="504">可配置保护规则<tspan x="642" dy="32">默认以终止为主</tspan></text><text x="972" y="504">策略需更灵活时<tspan x="972" dy="32">评估适配与维护</tspan></text></g>
<g id="recommend" data-pptx-bounds="64 588 1152 74" fill="#181818"><text x="64" y="616" fill="#BC4733">当前先评估 systemd-oomd 是否满足组级保护；不满足再比较替代策略。</text><text x="64" y="651" font-size="18" fill="#666666">都需要确认允许终止的范围；避免偏好不等于绝对保护，不应让多个终止策略无协调地运行。</text></g>
