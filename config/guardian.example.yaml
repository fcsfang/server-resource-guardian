# 历史讨论样例，不是当前运行时格式；当前运行配置是 guardian.example.json。
# 当前 JSON schema：../config/guardian.schema.json；本 YAML 不被 Guardian 读取。
version: 1

agent:
  mode: observe  # observe | simulate | enforce
  sample_interval: 5s
  snapshot_directory: /var/lib/server-resource-guardian/snapshots
  snapshot_max_total_size: 256MiB

control_plane:
  enabled: false
  endpoint: ""
  outbound_connection: true
  mutual_tls: true

alerts:
  # 下列阈值是 PoC 占位值，不得直接用于生产。
  cpu:
    warning_utilization_percent: 85
    warning_for: 5m
  memory:
    warning_available_percent: 15
    warning_for: 3m
  psi:
    enabled: true

actions:
  enabled: false
  require_approval: true
  graceful_timeout: 30s
  cooldown: 10m
  max_actions_per_host_per_hour: 2
  allow:
    # 仅对业务明确允许的对象配置 throttle，不作为通用默认动作。
    throttle: []
    terminate: []
    restart_container: []

protection:
  systemd_units:
    - guardian-runtime.service
    - guardian-collector.service
    - guardian-broker.service
    - beszel.service
    - beszel-agent.service
    - ssh.service
    - sshd.service
    - systemd-logind.service
    - systemd-journald.service
    - docker.service
    - containerd.service
  executable_paths: []
  container_labels:
    - guardian.role=control-plane
    - guardian.role=guardian
    - com.docker.compose.service=beszel
    - com.docker.compose.service=beszel-agent
    - com.docker.compose.service=beszel-isolated
    - com.docker.compose.service=beszel-agent-isolated

audit:
  local_buffer_enabled: true
  remote_export_enabled: false
